version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_itmonitor_db
    restart: always
    environment:
      POSTGRES_USER: ai_itmonitor_user
      POSTGRES_PASSWORD: ai_itmonitor_password
      POSTGRES_DB: ai_itmonitor_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ai_itmonitor_backend
    restart: always
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ai_itmonitor_user
      POSTGRES_PASSWORD: ai_itmonitor_password
      POSTGRES_DB: ai_itmonitor_db
      POSTGRES_PORT: 5432
      SCAN_SUBNET: "${SCAN_SUBNET:-}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5:0.5b"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ai_itmonitor_ollama
    restart: always
    environment:
      OLLAMA_MODEL: "qwen2.5:0.5b"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        echo "[ollama] waiting for server to come up..."
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "[ollama] pulling model $${OLLAMA_MODEL} ..."
        ollama pull "$${OLLAMA_MODEL}" || echo "[ollama] pull failed; app will keep retrying"
        echo "[ollama] ready"
        wait $$pid

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ai_itmonitor_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_data:
