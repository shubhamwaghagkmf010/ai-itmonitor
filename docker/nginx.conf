# AI-ITMonitor frontend/reverse-proxy. One entrypoint (443) terminates TLS, serves the
# built SPA, and proxies /api/ to the backend - so the browser UI and every agent talk
# to a single HTTPS address. Certificates are read from a mounted volume (never baked
# into the image), so renewing/replacing them needs only a container restart.

# Do not announce the nginx version in headers and error pages.
server_tokens off;

server {
    listen 80;
    server_name _;

    # Left open for a future Let's Encrypt HTTP-01 challenge; harmless (404) until used.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server/server.crt;
    ssl_certificate_key /etc/nginx/certs/server/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Agents upload their software inventory (up to 8 MB); nothing else needs a large request.
    client_max_body_size 10m;

    # One-click trust: let a human visiting this IP in a browser download our
    # internal root CA (public cert only) and import it, so future visits show no
    # warning. https://<ip>/ca.crt -> accept the one-time cert warning -> save ->
    # double-click -> Install Certificate -> Trusted Root Certification Authorities.
    location = /ca.crt {
        alias /etc/nginx/certs/ca/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    # Every agent (and the browser UI) reaches the backend through this same
    # HTTPS entrypoint - the backend itself no longer needs to be exposed directly.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # The AI SRE chat streams its reply token-by-token - without this, nginx
        # buffers the WHOLE response before sending any of it to the browser,
        # which would silently turn streaming back into one long wait.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
