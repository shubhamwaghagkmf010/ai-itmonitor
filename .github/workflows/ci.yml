name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      # The runner image ships the PostgreSQL server programs, so the migration tests run against a real
      # (throwaway) PostgreSQL instead of being skipped.
      - run: python -m pytest -q

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend lint, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  containers:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid, and refuses to start without a database password
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-password\n' > backend/.env
          docker compose --env-file backend/.env config --quiet
          printf 'SECRET_KEY=x\n' > backend/.env
          if docker compose --env-file backend/.env config --quiet 2>/dev/null; then
            echo "compose accepted a missing POSTGRES_PASSWORD"; exit 1
          fi
          rm backend/.env
      - name: Build the images
        run: |
          docker build -f docker/Dockerfile.backend -t aim-backend:ci .
          docker build -f docker/Dockerfile.frontend -t aim-frontend:ci .
      - name: The backend image runs as an unprivileged user and holds no settings file
        run: |
          test "$(docker run --rm --entrypoint id aim-backend:ci -u)" = "10001"
          docker run --rm --entrypoint sh aim-backend:ci -c 'test ! -e /app/backend/.env && test ! -e /app/agent/agent_config.json'
      - name: The backend image imports its code and starts
        run: |
          docker run --rm --entrypoint python -e SECRET_KEY="$(openssl rand -hex 24)" aim-backend:ci \
            -c "import backend.app.main; print('imports ok')"
